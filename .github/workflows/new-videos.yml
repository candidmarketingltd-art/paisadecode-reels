name: Add new YouTube uploads to the calendar

on:
  schedule:
    - cron: "15 4 * * *"   # daily 09:45 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.new_videos
      - run: |
          git config user.name "paisadecode-bot"
          git config user.email "bot@users.noreply.github.com"
          git add calendar
          git diff --cached --quiet || git commit -m "queue new uploads"
          git pull --rebase -q && git push -q || echo "nothing to push"
