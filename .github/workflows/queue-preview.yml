name: Queue the latest preview reel in Buffer

# Push "<video_id> <angle>" to triggers/queue-preview.txt -> the reel on the "previews" branch is queued in Buffer as-is.
on:
  push:
    paths: ["triggers/queue-preview.txt"]

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Queue it
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin previews
          mkdir -p out && git show origin/previews:preview.mp4 > out/preview.mp4
          read VID ANGLE < triggers/queue-preview.txt
          python -m pipeline.queue_file out/preview.mp4 "$VID" "$ANGLE"
      - name: Save calendar & logs
        if: always()
        run: |
          git config user.name "paisadecode-bot"
          git config user.email "bot@users.noreply.github.com"
          for d in calendar logs; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -m "queued preview ${{ github.run_number }}"
          git pull --rebase -q && git push -q || echo "nothing to push"
