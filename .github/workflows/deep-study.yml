name: Deep study of reference reels (private, encrypted output)

on:
  push:
    paths: ["triggers/deep-study.txt"]   # one reel URL per line

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg age
          pip install -q faster-whisper librosa matplotlib pillow requests
      - name: Download and analyse
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          mapfile -t U < <(grep -v '^\s*$' triggers/deep-study.txt)
          python tools/deep_study.py deep_out "${U[@]}"
      - name: Encrypt and save (only the session key can open it)
        if: always()
        run: |
          mkdir -p study && tar czf - deep_out | age -r "$(cat tools/study_pubkey.txt)" > study/deep.tar.gz.age
          git config user.name "paisadecode-bot"; git config user.email "bot@users.noreply.github.com"
          git add study && git commit -m "deep study result" && git pull -q --rebase && git push -q || true
