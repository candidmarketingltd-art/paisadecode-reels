name: Photo search test

on:
  push:
    paths: ["triggers/photo-test.txt"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t Q < triggers/photo-test.txt
          PHOTO_TEST_DIR=/tmp/pt python -m pipeline.render.photos "${Q[@]}" | tee /tmp/pt/log.txt || true
          cd /tmp/pt && git init -q && git checkout -q -b photo-test && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm test
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" photo-test
